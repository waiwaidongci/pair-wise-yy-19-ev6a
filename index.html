<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片显微照片索引台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Petrographic Slide Index</p>
        <h1>岩芯薄片显微照片索引台</h1>
      </div>
      <div class="mast-actions">
        <p id="exportNote" class="export-note"></p>
        <button id="exportBtn" type="button">导出观察清单</button>
      </div>
    </header>

    <section class="layout">
      <form id="sampleForm" class="editor">
        <h2 id="formTitle">样本录入</h2>
        <label>显微照片<input id="photoInput" type="file" accept="image/*"></label>
        <label>样本编号<input name="code" required placeholder="BX-17-03"></label>
        <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
        <div class="pair">
          <label>放大倍数<input name="magnification" placeholder="40x"></label>
          <label>偏光类型
            <select name="polarization">
              <option>单偏光</option>
              <option>正交偏光</option>
              <option>反射光</option>
            </select>
          </label>
        </div>
        <div class="pair">
          <label>标尺长度（µm）<input name="scaleLength" type="number" min="0" step="any" placeholder="200"></label>
          <label>视野宽度（µm）<input name="fieldWidth" type="number" min="0" step="any" placeholder="1200"></label>
        </div>
        <div class="pair">
          <label>曝光值（40–80）<input name="exposure" type="number" min="0" max="100" step="any" placeholder="62"></label>
          <label>录入人<input name="enteredBy" required placeholder="张工"></label>
        </div>
        <p class="form-hint">缺标尺或曝光超出 40–80 的照片只进待复核，复核通过前不参与对比与导出。</p>
        <label>主要矿物<input name="minerals" placeholder="石英、斜长石、黑云母"></label>
        <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
        <label>老师批注<textarea name="comment" rows="4" placeholder="记录鉴定依据或疑点"></textarea></label>
        <button type="submit" id="submitBtn">保存样本</button>
        <button type="button" id="cancelEditBtn" class="ghost" hidden>取消编辑</button>
      </form>

      <section class="board">
        <div class="filters">
          <input id="mineralFilter" placeholder="按矿物筛选">
          <select id="polarFilter">
            <option value="">全部偏光</option>
            <option>单偏光</option>
            <option>正交偏光</option>
            <option>反射光</option>
          </select>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="approved">已准入</option>
            <option value="pending">待复核</option>
          </select>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>
      </section>

      <aside class="compare">
        <h2>并排对比</h2>
        <div id="comparePane" class="compare-pane"></div>
      </aside>
    </section>
  </main>
  <script src="./store.js"></script>
  <script src="./rules.js"></script>
  <script src="./ui.js"></script>
</body>
</html>
